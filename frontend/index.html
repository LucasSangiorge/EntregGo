<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>EntregGo — Cadastro de Entregadores</title>
    <link rel="stylesheet" href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Entrego<span>Go</span> — Galpão</h1>
        <nav>
            <a href="index.html" class="ativo">Entregadores</a>
            <a href="encomendas.html">Encomendas</a>
            <a href="resultado.html">Painel</a>
        </nav>
    </header>

    <main>
        <div class="card">
            <h2>Contratar entregador</h2>
            <form id="form-entregador">
                <label>Nome
                    <input type="text" id="nome" placeholder="Nome do entregador" required>
                </label>
                <label>Veículo
                    <select id="tipo_veiculo" required>
                        <option value="moto">Moto</option>
                        <option value="carro">Carro</option>
                        <option value="caminhao">Caminhão</option>
                    </select>
                </label>
                <label>Capacidade (kg)
                    <input type="number" id="capacidade_kg" placeholder="Ex: 20" step="0.1" required>
                </label>
                <button type="submit">Contratar</button>
            </form>
            <p id="msg-entregador" class="msg"></p>
        </div>

        <div class="card">
            <h2>Entregadores do galpão</h2>
            <button id="btn-atualizar">Atualizar lista</button>
            <div class="tabela-wrap" id="tabela-entregadores"></div>
        </div>
    </main>

    <script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
